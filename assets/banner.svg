<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="50%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#38ef7d" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152037" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0c1424" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .audio-bar {
      transform-origin: bottom;
      animation: soundPulse 1.8s ease-in-out infinite alternate;
    }
    .bar-1 { animation-delay: 0.1s; }
    .bar-2 { animation-delay: 0.35s; }
    .bar-3 { animation-delay: 0.6s; }
    .bar-4 { animation-delay: 0.2s; }
    .bar-5 { animation-delay: 0.5s; }
    .bar-6 { animation-delay: 0.75s; }
    .bar-7 { animation-delay: 0.15s; }
    .bar-8 { animation-delay: 0.4s; }
    .bar-9 { animation-delay: 0.85s; }

    @keyframes soundPulse {
      0% { transform: scaleY(0.35); opacity: 0.4; }
      50% { transform: scaleY(1.0); opacity: 0.9; }
      100% { transform: scaleY(0.5); opacity: 0.6; }
    }

    .pulse-glow {
      animation: pulseGlowAnim 3.5s ease-in-out infinite alternate;
    }
    @keyframes pulseGlowAnim {
      0% { opacity: 0.3; transform: scale(0.96); }
      100% { opacity: 0.7; transform: scale(1.04); }
    }

    .node-flow {
      stroke-dasharray: 6 6;
      animation: dashFlow 20s linear infinite;
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -120; }
    }

    .orb-float {
      animation: orbFloatAnim 6s ease-in-out infinite alternate;
    }
    @keyframes orbFloatAnim {
      0% { transform: translate(0, 0); }
      100% { transform: translate(15px, -15px); }
    }
  </style>

  <!-- Deep Sci-Fi / Cyber Tech Background Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <g class="orb-float">
    <circle cx="1020" cy="110" r="180" fill="url(#glowGrad)" />
    <circle cx="200" cy="320" r="140" fill="url(#glowGrad)" />
  </g>

  <!-- Subtle Coordinate Grid Background -->
  <g opacity="0.12" stroke="#38ef7d" stroke-width="0.5">
    <line x1="80" y1="0" x2="80" y2="420"/>
    <line x1="240" y1="0" x2="240" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="560" y1="0" x2="560" y2="420"/>
    <line x1="720" y1="0" x2="720" y2="420"/>
    <line x1="880" y1="0" x2="880" y2="420"/>
    <line x1="1040" y1="0" x2="1040" y2="420"/>
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
  </g>

  <!-- Right-Hand Side DYNAMIC ELEMENTS (Sound Waveform, Neural Voice Graph, Speech Spectrum) -->
  <!-- Stays strictly on the right (x > 750) so titles and subtitles in foreground never collide -->
  <g transform="translate(760, 0)">
    <!-- Circuit & Connection flow lines -->
    <path d="M 60,180 C 120,100 180,240 240,160 S 330,80 380,180" fill="none" stroke="#00f2fe" stroke-width="1.8" class="node-flow" opacity="0.4" />
    <path d="M 40,240 C 100,280 160,160 220,240 S 310,260 360,200" fill="none" stroke="#38ef7d" stroke-width="1.8" class="node-flow" opacity="0.3" />

    <!-- Interactive Speech Analytics Card -->
    <g transform="translate(60, 95)" filter="url(#softShadow)">
      <rect width="330" height="230" rx="16" fill="url(#cardGrad)" stroke="#1f3454" stroke-width="1.5" />
      
      <!-- Card Header: Live Audio Stream Visualizer -->
      <circle cx="28" cy="28" r="5" fill="#38ef7d">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite" />
      </circle>
      <text x="42" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#00f2fe" letter-spacing="1">AUDIO STREAM // DIARIZATION ENGINE</text>
      
      <!-- Audio Spectrum Equalizer Bars -->
      <g transform="translate(30, 110)">
        <!-- Bar 1 -->
        <rect class="audio-bar bar-1" x="0" y="-55" width="8" height="60" rx="4" fill="#38ef7d"/>
        <!-- Bar 2 -->
        <rect class="audio-bar bar-2" x="14" y="-80" width="8" height="85" rx="4" fill="#00f2fe"/>
        <!-- Bar 3 -->
        <rect class="audio-bar bar-3" x="28" y="-45" width="8" height="50" rx="4" fill="#38ef7d"/>
        <!-- Bar 4 -->
        <rect class="audio-bar bar-4" x="42" y="-95" width="8" height="100" rx="4" fill="#11998e"/>
        <!-- Bar 5 -->
        <rect class="audio-bar bar-5" x="56" y="-70" width="8" height="75" rx="4" fill="#00f2fe"/>
        <!-- Bar 6 -->
        <rect class="audio-bar bar-6" x="70" y="-105" width="8" height="110" rx="4" fill="#38ef7d"/>
        <!-- Bar 7 -->
        <rect class="audio-bar bar-7" x="84" y="-60" width="8" height="65" rx="4" fill="#00f2fe"/>
        <!-- Bar 8 -->
        <rect class="audio-bar bar-8" x="98" y="-90" width="8" height="95" rx="4" fill="#11998e"/>
        <!-- Bar 9 -->
        <rect class="audio-bar bar-9" x="112" y="-40" width="8" height="45" rx="4" fill="#38ef7d"/>
        <!-- Bar 10 -->
        <rect class="audio-bar bar-2" x="126" y="-75" width="8" height="80" rx="4" fill="#00f2fe"/>
        <!-- Bar 11 -->
        <rect class="audio-bar bar-5" x="140" y="-98" width="8" height="102" rx="4" fill="#38ef7d"/>
        <!-- Bar 12 -->
        <rect class="audio-bar bar-7" x="154" y="-50" width="8" height="55" rx="4" fill="#00f2fe"/>
      </g>

      <!-- Analytics Real-Time Telemetry Metrics -->
      <g transform="translate(198, 62)">
        <rect width="105" height="46" rx="8" fill="#0a1220" stroke="#162e49" stroke-width="1" />
        <text x="10" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">SPEAKER DER</text>
        <text x="10" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#38ef7d">&lt; 3.2%</text>
      </g>

      <g transform="translate(198, 118)">
        <rect width="105" height="46" rx="8" fill="#0a1220" stroke="#162e49" stroke-width="1" />
        <text x="10" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">TALK RATIO</text>
        <text x="10" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#00f2fe">42% / 58%</text>
      </g>

      <!-- Bottom Audio Timeline / Track indicator -->
      <g transform="translate(26, 185)">
        <rect width="278" height="26" rx="6" fill="#0b1424" stroke="#1b304c" stroke-width="1" />
        <circle cx="16" cy="13" r="4" fill="#38ef7d" />
        <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">Spk 1: Buyer Intent Detected [Score: 92]</text>
      </g>
    </g>

    <!-- Pulsing Neural Voice Node Orbit -->
    <g transform="translate(225, 60)" class="pulse-glow">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4 4"/>
      <circle cx="0" cy="0" r="10" fill="#00f2fe" opacity="0.6"/>
    </g>
  </g>

  <!-- FOREGROUND BRANDING CONTENT (Ensured 100% clear from background animations) -->
  <g transform="translate(75, 0)">
    <!-- Category Highlight Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="360" height="34" rx="17" fill="#0e233d" stroke="#00f2fe" stroke-width="1.2" />
      <circle cx="18" cy="17" r="5" fill="#38ef7d">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#00f2fe" letter-spacing="1.2">CONVERSATION INTELLIGENCE &amp; SPEECH AI</text>
    </g>

    <!-- Hero Title -->
    <text x="0" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.8">
      Awesome <tspan fill="url(#primaryGrad)">Speech &amp; Conversation</tspan>
    </text>
    <text x="0" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#f1f5f9" letter-spacing="-0.6">
      Analytics Platform Ecosystem
    </text>

    <!-- Subtitle and Value Proposition -->
    <text x="0" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Curated index of Speech Recognition (ASR), Speaker Diarization, Real-Time Audio Telemetry,
    </text>
    <text x="0" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Sales Call Scoring, Contact Center QA, and Open-Source Revenue Intelligence alternatives.
    </text>

    <!-- Feature Pillars / Badges -->
    <g transform="translate(0, 305)">
      <!-- Pill 1: STT & Diarization -->
      <g transform="translate(0, 0)">
        <rect width="185" height="38" rx="10" fill="#111f36" stroke="#1d3d63" stroke-width="1.2" />
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#38ef7d">🎙️ STT &amp; Diarization</text>
      </g>
      <!-- Pill 2: Revenue Intelligence -->
      <g transform="translate(200, 0)">
        <rect width="195" height="38" rx="10" fill="#111f36" stroke="#1d3d63" stroke-width="1.2" />
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#00f2fe">📈 Revenue Intelligence</text>
      </g>
      <!-- Pill 3: Contact Center QA -->
      <g transform="translate(410, 0)">
        <rect width="185" height="38" rx="10" fill="#111f36" stroke="#1d3d63" stroke-width="1.2" />
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#facc15">🎧 Contact Center QA</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#primaryGrad)"/>
</svg>
